# This file is a Helm values file for the agent-platform-operator chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#
image:
  # -- Image repository, below `registry.domain`.
  name: "giantswarm/agent-platform-operator"
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""
registry:
  # -- Image registry.
  domain: gsoci.azurecr.io

# -- The platform namespace (kagent's) the network policies are copied from.
platformNamespace: kagent

networkPolicy:
  # -- Kind of the network policies copied into every organization namespace:
  # `kubernetes` (NetworkPolicy) or `cilium` (CiliumNetworkPolicy). Empty
  # copies none.
  flavor: ""
  # -- Names of the network policies in `platformNamespace` copied into every
  # organization namespace (the platform's worker policy,
  # `substrate-workers` with Cilium, `substrate-workers-ingress` with
  # Kubernetes network policies).
  names: []  # @schema item: string

agentChart:
  # -- OCI URL of the agent chart. The OCIRepository kept in every
  # organization namespace is named after its last segment (`agent`); the
  # organization's HelmReleases reference it by that name. Empty keeps none.
  ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
  # -- Semver range the OCIRepository tracks.
  semver: "2.x"
  # -- Regular expression the chart's tags must match before the range is
  # evaluated (the OCIRepository's `ref.semverFilter`); empty filters nothing.
  semverFilter: ""
  # -- OCIRepository.spec.interval.
  interval: 30m
  # -- source.toolkit.fluxcd.io API version of the OCIRepository.
  ociRepositoryApiVersion: source.toolkit.fluxcd.io/v1

# -- The ServiceAccount the organization's HelmReleases run as
# (`spec.serviceAccountName`, which helm-controller impersonates), kept in
# every organization namespace and bound there to the ClusterRole
# `agent-platform-tenant-flux`. The same name as agent-manager's
# `flux.helmReleaseServiceAccount`. Empty keeps none.
helmReleaseServiceAccount: kagent-flux

# -- ClusterRoles bound to a ServiceAccount of another namespace in every
# organization namespace, such as Substrate's credential providers' Secret
# readers, which read the Secret an actor's credential names there. Each
# ClusterRole is bound by a RoleBinding named after it (listed once, not the
# Helm or Flux binding's name), and the operator gets `bind` on it; a
# ClusterRole removed from the list loses its bindings. The agent-platform
# chart's admission policy holds which ServiceAccounts the operator binds
# there.
serviceAccountBindings: []  # @schema item: object; itemProperties: {"clusterRole": {"type": "string", "minLength": 1}, "serviceAccount": {"type": "object", "additionalProperties": false, "required": ["namespace", "name"], "properties": {"namespace": {"type": "string", "minLength": 1}, "name": {"type": "string", "minLength": 1}}}}; itemRequired: [clusterRole, serviceAccount]

snapshots:
  # -- Bucket of the organizations' worker snapshots: an organization's
  # `status.snapshotPrefix` is `s3://<bucket>/<uid>`. Empty leaves it empty.
  bucket: ""
  # -- AWS region of the bucket, the AWS_REGION of the operator; empty takes
  # the one the pod's environment sets, if any.
  region: ""

curated:
  # -- Copy the curated objects of `platformNamespace`, read-only, into every
  # organization namespace: the Harnesses an organization's `spec.harnesses`
  # names (pointed at its own pool and snapshot prefix, kagent memory off),
  # the WorkerPool `workerPool` with its ServiceAccount, the Agents and
  # AgentTemplates labelled `agent-platform.giantswarm.io/curated: "true"`
  # (their template's `modelConfig` set to the organization's default
  # ModelConfig) and the RemoteMCPServers they name. Needs `snapshots.bucket`,
  # `erasure.kagent.target`, `erasure.substrate.target` and an API server
  # that serves `kagentApiVersion` and `workerPoolApiVersion`.
  enabled: false
  # -- The curated WorkerPool in `platformNamespace`.
  workerPool: kagent-default
  # -- api.kagent.dev API version of the Agents, AgentTemplates, Harnesses,
  # ModelConfigs and RemoteMCPServers.
  kagentApiVersion: api.kagent.dev/v1alpha3
  # -- ate.dev API version of the WorkerPool.
  workerPoolApiVersion: ate.dev/v1alpha1

# @schema additionalProperties: {"type": "null"}; patternProperties: {"^([^/]+/[^/]+|pods|services|secrets|configmaps|persistentvolumeclaims|replicationcontrollers|resourcequotas|services[.]nodeports|services[.]loadbalancers|cpu|memory|ephemeral-storage|requests[.](cpu|memory|storage|ephemeral-storage)|limits[.](cpu|memory|ephemeral-storage)|(requests[.])?hugepages-.+)$": {"type": ["string", "null"]}}
# -- Hard limits of the ResourceQuota `agent-platform-organization-objects`
# kept in every organization namespace, as `<resource>: <count>`: object
# counts, so one organization cannot flood the API server. A key set to
# `null` drops its limit, also a key the chart does not set; no key keeps
# no ResourceQuota. A key without `/` must be a standard quota resource
# (`pods`, `services`, `secrets`, `configmaps`, ...): count other kinds as
# `count/<resource>.<group>` (`count/serviceaccounts` for the core group),
# or the API server refuses the ResourceQuota. The chart refuses such a key
# with "at '/objectQuota/<key>': got string, want null".
# @default -- object counts of the kinds an organization writes
objectQuota:
  configmaps: "500"
  secrets: "1000"
  services: "100"
  count/serviceaccounts: "100"
  count/rolebindings.rbac.authorization.k8s.io: "200"
  count/agents.api.kagent.dev: "200"
  count/agenttemplates.api.kagent.dev: "200"
  count/modelconfigs.api.kagent.dev: "100"
  count/remotemcpservers.api.kagent.dev: "200"
  count/helmreleases.helm.toolkit.fluxcd.io: "200"

serviceAccount:
  # @schema additionalProperties: true
  # -- Annotations of the operator's ServiceAccount, for example
  # `eks.amazonaws.com/role-arn`: the IRSA role the erasure deletes snapshots
  # under the organizations' prefixes of `snapshots.bucket` with.
  annotations: {}

erasure:
  # -- The namespace of the installation's Flux source, where an
  # organization's Flux Kustomization and Flux ServiceAccount live, labelled
  # agent-platform.giantswarm.io/organization-uid with its UID: the erasure
  # deletes them there. The same as the agent-platform chart's
  # agentPlatformOrganizations.fluxNamespace. Empty: there are none.
  fluxNamespace: ""
  # -- How long after the first deletion of a deleted organization's
  # snapshot prefix it is deleted again. Keep it at least Substrate's actor
  # workflow deadline, which ate-api sets to 5m by default, so an upload that
  # started before the organization's last actor went has ended.
  snapshotDelay: 5m
  # -- How often an erasure step that waits for something to be gone looks
  # again.
  pollInterval: 10s
  # -- kustomize.toolkit.fluxcd.io API version of the organizations' Flux
  # Kustomizations and of the installation's.
  kustomizationApiVersion: kustomize.toolkit.fluxcd.io/v1
  # -- helm.toolkit.fluxcd.io API version of the organizations' HelmReleases.
  helmReleaseApiVersion: helm.toolkit.fluxcd.io/v2
  kagent:
    # -- The kagent controller's gRPC API (`grpc://host:port` or
    # `grpcs://host[:port]`), through which the erasure deletes a deleted
    # organization's sessions, as the operator's ServiceAccount. Empty skips
    # them; required with `curated.enabled`.
    target: ""
    # -- The audience of the ServiceAccount token sent to kagent: the
    # controller's machine audience.
    audience: kagent
  substrate:
    # -- Substrate's ate-api (`grpcs://host[:port]`), which the erasure asks
    # until a deleted organization has no actor left. Empty skips the wait;
    # required with `curated.enabled`.
    target: ""
    # -- The audience of the ServiceAccount token sent to ate-api: one its
    # Kubernetes JWT provider accepts.
    audience: ""
    caClusterTrustBundle:
      # -- Signer of the ClusterTrustBundles ate-api's serving certificate is
      # verified with, projected into the pod (Substrate's
      # `servicedns.podcert.ate.dev/identity`). The kubelet updates the
      # projection when a bundle changes and the operator reads it at each new
      # connection, so a rotated CA is trusted without a restart. Needs the
      # `ClusterTrustBundleProjection` feature. Set: `caConfigMap.name` must be
      # empty.
      signerName: ""
      # -- Labels a ClusterTrustBundle of `signerName` must carry to be
      # projected (Substrate's live bundles carry
      # `podcert.ate.dev/canarying: live`). Empty: every ClusterTrustBundle of
      # `signerName`.
      matchLabels: {}  # @schema additionalProperties: {type: string}
    caConfigMap:
      # -- ConfigMap holding the CA bundle ate-api's serving certificate is
      # verified with, for a cluster without the ClusterTrustBundle
      # projection. Empty, with `caClusterTrustBundle.signerName` empty too:
      # the system roots.
      name: ""
      # -- Key of the CA bundle in the ConfigMap.
      key: ca.crt

commitMode:
  sourceRef:
    # -- Kind of the installation's Flux source in `erasure.fluxNamespace`:
    # `GitRepository` or `OCIRepository`.
    kind: GitRepository  # @schema enum: [GitRepository, OCIRepository]
    # -- The installation's Flux source. Set: commit mode, every organization
    # gets, in `erasure.fluxNamespace`, a Kustomization that applies its path
    # from this source into its namespace, and the Flux ServiceAccount that
    # Kustomization runs as, both named after the organization namespace,
    # bound in the organization namespace only to `clusterRole`. Empty: none.
    # Needs `erasure.fluxNamespace`.
    name: ""
  # -- The installation's SOPS key Secret in `erasure.fluxNamespace`, which
  # the organizations' Kustomizations decrypt with; empty decrypts nothing.
  decryptionSecret: sops-keys
  # -- An organization's path in the source: `{parent}` and `{name}` are
  # replaced by its parent namespace and its name. An installation puts it
  # under its own agent-platform configuration path, outside what the
  # installation's Kustomization applies.
  path: ./agent-platform/organizations/{parent}/{name}
  # -- `spec.interval` of the organizations' Kustomizations.
  interval: 10m
  # -- The ClusterRole an organization's Flux ServiceAccount is bound to in
  # its organization namespace (rendered by the agent-platform chart).
  clusterRole: agent-platform:organization-flux
  installationKustomization:
    # -- The installation's Kustomization that applies the
    # AgentPlatformOrganizations (with `deletionPolicy: Orphan`). An
    # organization it applied is `Orphaned` while it is missing from its
    # inventory, with reason `DeleteMerged` when it carries
    # `agent-platform.giantswarm.io/delete-pull-request`, `MissingFromGit`
    # otherwise. Empty: no `Orphaned` condition.
    name: ""
    # -- Its namespace; empty is `erasure.fluxNamespace`.
    namespace: ""

# -- How often every organization is reconciled without a change. A change to
# an organization, its namespace, its objects there, a parent's
# organizations-admin RoleBinding, a copied network policy, a curated object
# or a ModelConfig in its namespace reconciles it at once.
syncPeriod: 10m

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
