# This file is a Helm values file for the agent-platform-operator chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#
image:
  # -- Image repository, below `registry.domain`.
  name: "giantswarm/agent-platform-operator"
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""
registry:
  # -- Image registry.
  domain: gsoci.azurecr.io

# -- The platform namespace (kagent's) the network policies are copied from.
platformNamespace: kagent

networkPolicy:
  # -- Kind of the network policies copied into every organization namespace:
  # `kubernetes` (NetworkPolicy) or `cilium` (CiliumNetworkPolicy). Empty
  # copies none.
  flavor: ""
  # -- Names of the network policies in `platformNamespace` copied into every
  # organization namespace (the platform's worker policy,
  # `substrate-workers` with Cilium, `substrate-workers-ingress` with
  # Kubernetes network policies).
  names: []  # @schema item: string

agentChart:
  # -- OCI URL of the agent chart. The OCIRepository kept in every
  # organization namespace is named after its last segment (`agent`); the
  # organization's HelmReleases reference it by that name. Empty keeps none.
  ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
  # -- Semver range the OCIRepository tracks.
  semver: "2.x"
  # -- Regular expression the chart's tags must match before the range is
  # evaluated (the OCIRepository's `ref.semverFilter`); empty filters nothing.
  semverFilter: ""
  # -- OCIRepository.spec.interval.
  interval: 30m
  # -- source.toolkit.fluxcd.io API version of the OCIRepository.
  ociRepositoryApiVersion: source.toolkit.fluxcd.io/v1

# -- The ServiceAccount the organization's HelmReleases run as
# (`spec.serviceAccountName`, which helm-controller impersonates), kept in
# every organization namespace and bound there to the ClusterRole
# `agent-platform-tenant-flux`. The same name as agent-manager's
# `flux.helmReleaseServiceAccount`. Empty keeps none.
helmReleaseServiceAccount: kagent-flux

snapshots:
  # -- Bucket of the organizations' worker snapshots: an organization's
  # `status.snapshotPrefix` is `s3://<bucket>/<uid>`. Empty leaves it empty.
  bucket: ""

curated:
  # -- Copy the curated objects of `platformNamespace`, read-only, into every
  # organization namespace: the Harnesses an organization's `spec.harnesses`
  # names (pointed at its own pool and snapshot prefix, kagent memory off),
  # the WorkerPool `workerPool` with its ServiceAccount, the Agents and
  # AgentTemplates labelled `agent-platform.giantswarm.io/curated: "true"`
  # (their template's `modelConfig` set to the organization's default
  # ModelConfig) and the RemoteMCPServers they name. Needs `snapshots.bucket`,
  # `erasure.kagent.target`, `erasure.substrate.target` and an API server
  # that serves `kagentApiVersion` and `workerPoolApiVersion`.
  enabled: false
  # -- The curated WorkerPool in `platformNamespace`.
  workerPool: kagent-default
  # -- api.kagent.dev API version of the Agents, AgentTemplates, Harnesses,
  # ModelConfigs and RemoteMCPServers.
  kagentApiVersion: api.kagent.dev/v1alpha3
  # -- ate.dev API version of the WorkerPool.
  workerPoolApiVersion: ate.dev/v1alpha1

# @schema additionalProperties: true
# -- Hard limits of the ResourceQuota `agent-platform-organization-objects`
# kept in every organization namespace, as `<resource>: <count>`: object
# counts, so one organization cannot flood the API server. A key set to
# `null` drops its limit; no key keeps no ResourceQuota.
# @default -- object counts of the kinds an organization writes
objectQuota:
  configmaps: "500"
  secrets: "1000"
  services: "100"
  serviceaccounts: "100"
  count/rolebindings.rbac.authorization.k8s.io: "200"
  count/agents.api.kagent.dev: "200"
  count/agenttemplates.api.kagent.dev: "200"
  count/modelconfigs.api.kagent.dev: "100"
  count/remotemcpservers.api.kagent.dev: "200"
  count/helmreleases.helm.toolkit.fluxcd.io: "200"

serviceAccount:
  # @schema additionalProperties: true
  # -- Annotations of the operator's ServiceAccount, for example
  # `eks.amazonaws.com/role-arn`: the IRSA role the erasure deletes snapshots
  # under the organizations' prefixes of `snapshots.bucket` with.
  annotations: {}

erasure:
  # -- How long after the first deletion of a deleted organization's
  # snapshot prefix it is deleted again: at least Substrate's actor workflow
  # deadline (ate-api's `--actor-workflow-deadline`, 5m by default), so an
  # upload that started before the organization's last actor went has ended.
  snapshotDelay: 5m
  # -- How often an erasure step that waits for something to be gone looks
  # again.
  pollInterval: 10s
  # -- kustomize.toolkit.fluxcd.io API version of the organizations' Flux
  # Kustomizations.
  kustomizationApiVersion: kustomize.toolkit.fluxcd.io/v1
  # -- helm.toolkit.fluxcd.io API version of the organizations' HelmReleases.
  helmReleaseApiVersion: helm.toolkit.fluxcd.io/v2
  kagent:
    # -- The kagent controller's gRPC API (`grpc://host:port` or
    # `grpcs://host[:port]`), through which the erasure deletes a deleted
    # organization's sessions, as the operator's ServiceAccount. Empty skips
    # them; required with `curated.enabled`.
    target: ""
    # -- The audience of the ServiceAccount token sent to kagent: the
    # controller's machine audience.
    audience: kagent
  substrate:
    # -- Substrate's ate-api (`grpcs://host[:port]`), which the erasure asks
    # until a deleted organization has no actor left. Empty skips the wait;
    # required with `curated.enabled`.
    target: ""
    # -- The audience of the ServiceAccount token sent to ate-api: one its
    # Kubernetes JWT provider accepts.
    audience: ""
    caConfigMap:
      # -- ConfigMap holding the CA bundle ate-api's serving certificate is
      # verified with; empty uses the system roots.
      name: ""
      # -- Key of the CA bundle in the ConfigMap.
      key: ca.crt

# -- How often every organization is reconciled without a change. A change to
# an organization, its namespace, its objects there, a parent's
# organizations-admin RoleBinding, a copied network policy, a curated object
# or a ModelConfig in its namespace reconciles it at once.
syncPeriod: 10m

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
