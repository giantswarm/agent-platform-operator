{{- /*
The operator's own permissions.

RBAC cannot select namespaces by label, so the ClusterRole lets the
ServiceAccount create namespaces and write RoleBindings, ServiceAccounts,
OCIRepositories, network policies and ResourceQuotas in every namespace, and
with curated.enabled write and delete Agents, AgentTemplates, Harnesses,
RemoteMCPServers and WorkerPools in every namespace, the platform namespace's
curated sources included. The erasure of a deleted organization deletes
namespaces, ServiceAccounts, Flux Kustomizations, HelmReleases and Agents in
every namespace too. The ValidatingAdmissionPolicy that narrows these writes
to organization namespaces (and namespace creation to agents-* namespaces
carrying the organization labels, and the Kustomizations and ServiceAccounts
in the installation's Flux namespace to those labelled
agent-platform.giantswarm.io/organization-uid)
is rendered by the agent-platform chart, not here.

In commit mode (commitMode.sourceRef.name) the operator also creates, updates
and deletes the organizations' Kustomizations and Flux ServiceAccounts in the
Flux namespace, and reads the installation's Kustomization
(commitMode.installationKustomization) for the Orphaned condition.

The operator binds three ClusterRoles and nothing else: `bind` on those
names, no `escalate`, no cluster-admin. agent-platform:organizations-admin for
the mirrored bindings of a parent namespace, agent-platform-tenant-flux for
the organization's Helm ServiceAccount, agent-platform:organization-flux for
the organization's Flux ServiceAccount (commit mode), in the organization
namespace only.
*/}}
{{- $netpol := include "networkPolicyResource" . | default "{}" | fromJson }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "name" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  # The finalizer that holds a deleted organization until it is erased.
  - apiGroups: ["agent-platform.giantswarm.io"]
    resources: ["agentplatformorganizations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agent-platform.giantswarm.io"]
    resources: ["agentplatformorganizations/status"]
    verbs: ["get", "update", "patch"]
  # The organization namespaces: created from generateName, found by label,
  # deleted by the erasure.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The parents' organizations-admin bindings are read; the mirrors and the
  # Helm ServiceAccount's binding are written.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - "agent-platform:organizations-admin"
      - "agent-platform-tenant-flux"
      {{- if .Values.commitMode.sourceRef.name }}
      - {{ .Values.commitMode.clusterRole | quote }}
      {{- end }}
    verbs: ["bind"]
  # The Helm and worker ServiceAccounts, and the organization's Flux
  # ServiceAccount beside the installation's Flux source, which the erasure
  # deletes last.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]
  {{- if .Values.commitMode.sourceRef.name }}
  # Commit mode restores the Flux ServiceAccount's labels.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["update"]
  {{- end }}
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "create"]
  # The organization's Flux Kustomization: kept in commit mode, deleted by
  # the erasure; the installation's is read for the Orphaned condition. The
  # erasure deletes the HelmReleases and the Agents of its namespace too.
  {{- $c := .Values.commitMode }}
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs:
      - "list"
      - "delete"
      {{- if or $c.sourceRef.name $c.installationKustomization.name }}
      - "get"
      - "watch"
      {{- end }}
      {{- if $c.sourceRef.name }}
      - "create"
      - "update"
      {{- end }}
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents"]
    verbs: ["list", "delete"]
  # The ResourceQuota on object counts in every organization namespace.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  {{- if .Values.curated.enabled }}
  # The curated copies: read in platformNamespace, written in the
  # organization namespaces, deleted there when no longer curated.
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates", "harnesses", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # The ModelConfigs of the organization namespaces: whether one exists (the
  # worker replica rule) and which is marked as the default.
  - apiGroups: ["api.kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- with $netpol.resource }}
  # The network policies: read in platformNamespace, written in the
  # organization namespaces.
  - apiGroups: [{{ $netpol.group | quote }}]
    resources: [{{ . | quote }}]
    verbs: ["get", "list", "watch", "create", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "name" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "name" . }}
    namespace: {{ .Release.Namespace }}
---
# The leader Lease of the operator's replicas, and the events leader election
# records, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["agent-platform-operator"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "name" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "name" . }}
    namespace: {{ .Release.Namespace }}
