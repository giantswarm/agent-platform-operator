apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "name" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.registry.domain }}/{{ .Values.image.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            - --platform-namespace={{ .Values.platformNamespace }}
            {{- if include "networkPolicyResource" . }}
            - --network-policy-flavor={{ .Values.networkPolicy.flavor }}
            - --network-policies={{ join "," .Values.networkPolicy.names }}
            {{- end }}
            - --agent-chart-oci-url={{ .Values.agentChart.ociUrl }}
            - --agent-chart-semver={{ .Values.agentChart.semver }}
            {{- with .Values.agentChart.semverFilter }}
            - --agent-chart-semver-filter={{ . }}
            {{- end }}
            - --ocirepository-interval={{ .Values.agentChart.interval }}
            - --flux-ocirepository-api-version={{ .Values.agentChart.ociRepositoryApiVersion }}
            - --helmrelease-service-account={{ .Values.helmReleaseServiceAccount }}
            {{- with .Values.secretReaders }}
            - --secret-readers={{ include "secretReaders" $ }}
            {{- end }}
            {{- with .Values.snapshots.bucket }}
            - --snapshot-bucket={{ . }}
            {{- end }}
            {{- if .Values.curated.enabled }}
            {{- if not (and .Values.erasure.kagent.target .Values.erasure.substrate.target) }}
            {{- fail "curated.enabled needs erasure.kagent.target and erasure.substrate.target: a deleted organization's sessions and actors are erased through them" }}
            {{- end }}
            {{- if not .Values.snapshots.bucket }}
            {{- fail "curated.enabled needs snapshots.bucket: a Harness copy's snapshot location is s3://<bucket>/<uid>/<harness>" }}
            {{- end }}
            - --curated-copies
            - --curated-worker-pool={{ required "curated.workerPool is required with curated.enabled" .Values.curated.workerPool }}
            - --kagent-api-version={{ .Values.curated.kagentApiVersion }}
            - --workerpool-api-version={{ .Values.curated.workerPoolApiVersion }}
            {{- end }}
            {{- $quota := list }}
            {{- range $name, $count := .Values.objectQuota }}
            {{- $quota = append $quota (printf "%s=%v" $name $count) }}
            {{- end }}
            {{- with $quota }}
            - --object-quota={{ join "," . }}
            {{- end }}
            - --flux-kustomization-api-version={{ .Values.erasure.kustomizationApiVersion }}
            - --flux-helmrelease-api-version={{ .Values.erasure.helmReleaseApiVersion }}
            {{- with .Values.erasure.fluxNamespace }}
            - --flux-namespace={{ . }}
            {{- end }}
            {{- with .Values.commitMode }}
            {{- if .sourceRef.name }}
            {{- if not $.Values.erasure.fluxNamespace }}
            {{- fail "commitMode.sourceRef.name needs erasure.fluxNamespace: the organizations' Kustomizations live beside the installation's Flux source" }}
            {{- end }}
            - --flux-source-kind={{ .sourceRef.kind }}
            - --flux-source-name={{ .sourceRef.name }}
            {{- with .decryptionSecret }}
            - --flux-decryption-secret={{ . }}
            {{- end }}
            - --organization-path={{ .path }}
            - --organization-kustomization-interval={{ .interval }}
            {{- end }}
            - --organization-flux-cluster-role={{ .clusterRole }}
            {{- with .installationKustomization.name }}
            {{- $ns := $.Values.commitMode.installationKustomization.namespace | default $.Values.erasure.fluxNamespace }}
            {{- if not $ns }}
            {{- fail "commitMode.installationKustomization.name needs its namespace or erasure.fluxNamespace" }}
            {{- end }}
            - --installation-kustomization={{ $ns }}/{{ . }}
            {{- end }}
            {{- end }}
            - --snapshot-erase-delay={{ .Values.erasure.snapshotDelay }}
            - --erasure-poll-interval={{ .Values.erasure.pollInterval }}
            {{- with .Values.erasure.kagent.target }}
            - --kagent-target={{ . }}
            - --kagent-token-file=/var/run/secrets/agent-platform-operator/kagent/token
            {{- end }}
            {{- with .Values.erasure.substrate.target }}
            - --substrate-target={{ . }}
            - --substrate-token-file=/var/run/secrets/agent-platform-operator/substrate/token
            {{- $s := $.Values.erasure.substrate }}
            {{- if and $s.caClusterTrustBundle.signerName $s.caConfigMap.name }}
            {{- fail "erasure.substrate.caClusterTrustBundle.signerName and erasure.substrate.caConfigMap.name are exclusive: set one" }}
            {{- end }}
            {{- if $s.caClusterTrustBundle.signerName }}
            - --substrate-ca-file=/var/run/secrets/agent-platform-operator/substrate-ca/trust-bundle.pem
            {{- else if $s.caConfigMap.name }}
            - --substrate-ca-file=/var/run/secrets/agent-platform-operator/substrate-ca/{{ $s.caConfigMap.key }}
            {{- end }}
            {{- end }}
            - --sync-period={{ .Values.syncPeriod }}
            - --leader-election-namespace={{ .Release.Namespace }}
          {{- with .Values.snapshots.region }}
          env:
            - name: AWS_REGION
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $e := .Values.erasure }}
          {{- if or $e.kagent.target $e.substrate.target }}
          volumeMounts:
            {{- if $e.kagent.target }}
            - name: kagent-token
              mountPath: /var/run/secrets/agent-platform-operator/kagent
              readOnly: true
            {{- end }}
            {{- if $e.substrate.target }}
            - name: substrate-token
              mountPath: /var/run/secrets/agent-platform-operator/substrate
              readOnly: true
            {{- if or $e.substrate.caClusterTrustBundle.signerName $e.substrate.caConfigMap.name }}
            - name: substrate-ca
              mountPath: /var/run/secrets/agent-platform-operator/substrate-ca
              readOnly: true
            {{- end }}
            {{- end }}
      # The ServiceAccount's tokens the erasure calls kagent and Substrate
      # with, each bound to the audience its server accepts.
      volumes:
        {{- if $e.kagent.target }}
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "erasure.kagent.audience is required with erasure.kagent.target" $e.kagent.audience }}
                  expirationSeconds: 3600
        {{- end }}
        {{- if $e.substrate.target }}
        - name: substrate-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "erasure.substrate.audience is required with erasure.substrate.target" $e.substrate.audience }}
                  expirationSeconds: 3600
        {{- with $e.substrate.caClusterTrustBundle.signerName }}
        - name: substrate-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: {{ . }}
                  labelSelector:
                    matchLabels: {{- toYaml $e.substrate.caClusterTrustBundle.matchLabels | nindent 22 }}
                  path: trust-bundle.pem
        {{- else }}
        {{- if $e.substrate.caConfigMap.name }}
        - name: substrate-ca
          configMap:
            name: {{ $e.substrate.caConfigMap.name }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
