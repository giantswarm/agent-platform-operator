---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentplatformorganizations.agent-platform.giantswarm.io
spec:
  group: agent-platform.giantswarm.io
  names:
    kind: AgentPlatformOrganization
    listKind: AgentPlatformOrganizationList
    plural: agentplatformorganizations
    singular: agentplatformorganization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.namespace
      name: Organization namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.erasureStep
      name: Erasure
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentPlatformOrganization is a share of the installation's Agent Platform
          for one team: it lives in a parent namespace and owns an organization
          namespace that holds its agents, MCP servers, models, credentials and
          members.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: AgentPlatformOrganizationSpec is what the organization gets.
            properties:
              harnesses:
                description: Harnesses are the names of the curated Harnesses the
                  organization gets.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              workers:
                default: {}
                description: Workers sizes the organization's WorkerPool.
                properties:
                  replicas:
                    default: 1
                    description: |-
                      Replicas is the number of warm workers of the organization's WorkerPool
                      while the organization uses them: while its namespace holds a
                      ModelConfig and an Agent (a curated copy counts), or a ModelConfig and
                      a session. The pool runs 0 while the namespace holds no ModelConfig,
                      while it holds no Agent and no session, and while the organization is
                      Orphaned. A deleted organization runs Replicas until its sessions are
                      gone, so kagent can suspend its actors, and 0 after.

                      Not set means 1; 0 set on purpose runs no worker.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
            type: object
          status:
            description: AgentPlatformOrganizationStatus is what the operator observed.
            properties:
              conditions:
                description: |-
                  Conditions: Ready, DefaultModelConfigured and Orphaned. While the
                  organization is erased, Ready is False with reason Deleting and its
                  message names the step.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              erasureStep:
                description: |-
                  ErasureStep is the erasure step the operator is on once the
                  organization is deleted: Workloads, Sessions, Snapshots, Namespace or
                  OutsideObjects. Empty while the organization is not deleted.
                enum:
                - Workloads
                - Sessions
                - Snapshots
                - Namespace
                - OutsideObjects
                type: string
              lastAppliedRevision:
                description: |-
                  LastAppliedRevision is the last source revision the installation
                  Kustomization applied the organization from (e.g. <branch>@sha1:<sha>
                  for a GitRepository): that Kustomization's status.lastAppliedRevision
                  while the organization is in its settled inventory. It is kept while the
                  organization is Orphaned, so a removed file can be found in that
                  revision. Empty when no such revision was recorded: on an organization
                  applied without Flux, and on one already missing from the inventory when
                  the operator first ran with this field.
                type: string
              namespace:
                description: |-
                  Namespace is the organization namespace, created from the generateName
                  agents-<name>-.
                type: string
              snapshotPrefix:
                description: |-
                  SnapshotPrefix is where the organization's worker snapshots live,
                  s3://<bucket>/<uid>. Empty when the operator has no snapshot bucket.
                type: string
              snapshotsErasedAt:
                description: |-
                  SnapshotsErasedAt is when the operator first emptied the snapshot
                  prefix of the deleted organization; it empties it once more after the
                  snapshot erase delay.
                format: date-time
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'the name of an AgentPlatformOrganization is at most 50 characters:
            the organization namespace is agents-<name>- plus 5 random characters'
          rule: size(self.metadata.name) <= 50
        - message: 'the name of an AgentPlatformOrganization holds no dot: the organization
            namespace agents-<name>- is a DNS label'
          rule: '!self.metadata.name.contains(''.'')'
    served: true
    storage: true
    subresources:
      status: {}
